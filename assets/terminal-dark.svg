<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-label="terminal: whoami, stack, projects, motto">
<title>terminal: whoami, stack, projects, motto</title>
<style>

text{font:14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#e6edf3;white-space:pre}
.ti{font:13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#8b949e}
.cv{transform:translateX(var(--w));animation:type var(--d) steps(var(--n),end) var(--t) both}
@keyframes type{from{transform:translateX(0)}to{transform:translateX(var(--w))}}
.cur{animation:appear .01s linear var(--t) both}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="840" height="350" rx="12" fill="#161b22"/>

<line x1="0" y1="44" x2="840" y2="44" stroke="#30363d"/>
<circle cx="26" cy="22" r="6" fill="#ff5f56"/><circle cx="46" cy="22" r="6" fill="#ffbd2e"/><circle cx="66" cy="22" r="6" fill="#27c93f"/>
<text class="ti" x="420" y="27" text-anchor="middle">st@github: ~</text>
<text xml:space="preserve" x="24" y="80"><tspan fill="#ff7a59">$</tspan> whoami</text>
<text xml:space="preserve" x="24" y="106">st — data engineer by day, motion &amp; game tinkerer by night</text>
<text xml:space="preserve" x="24" y="140"><tspan fill="#ff7a59">$</tspan> cat stack.txt</text>
<text xml:space="preserve" x="24" y="166">SQL · Python · TypeScript · Three.js · SVG · ffmpeg</text>
<text xml:space="preserve" x="24" y="200"><tspan fill="#ff7a59">$</tspan> ls projects/</text>
<text xml:space="preserve" x="24" y="226">home-pwa/  motion-studio/  game-studio/  packaging-sim/  de-handbook/</text>
<text xml:space="preserve" x="24" y="260"><tspan fill="#ff7a59">$</tspan> echo $MOTTO</text>
<text xml:space="preserve" x="24" y="286">relax, you're doing fine</text>
