<rect class="cv" x="24" y="89" width="800" height="24" fill="#161b22" style="--w:496px;--n:58;--d:0.81s;--t:1.23s"/>
<rect class="cv" x="24" y="123" width="800" height="24" fill="#161b22" style="--w:134px;--n:15;--d:0.9s;--t:2.39s"/>
