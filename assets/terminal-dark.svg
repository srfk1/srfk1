<rect class="cv" x="24" y="183" width="800" height="24" fill="#161b22" style="--w:126px;--n:14;--d:0.84s;--t:4.60s"/>
<rect class="cv" x="24" y="209" width="800" height="24" fill="#161b22" style="--w:588px;--n:69;--d:0.97s;--t:5.69s"/>
<rect class="cv" x="24" y="243" width="800" height="24" fill="#161b22" style="--w:118px;--n:13;--d:0.78s;--t:7.01s"/>
<rect class="cv" x="24" y="269" width="800" height="24" fill="#161b22" style="--w:210px;--n:24;--d:0.34s;--t:8.04s"/>
<g class="cur" style="--t:8.73s"><text x="24" y="320" fill="#ff7a59" style="fill:#ff7a59">$</text>
