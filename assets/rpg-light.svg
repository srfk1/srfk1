<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 486" width="840" height="486" role="img" aria-label="RPG character sheet: stats, quests, achievements">
<title>RPG character sheet: stats, quests, achievements</title>
<style>

.h{font:700 24px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1f2328}
.s{font:14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1f2328}
.l{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#656d76;letter-spacing:2px}
.v{font:13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#656d76}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.q{animation:slide .5s ease-out both}
@keyframes slide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.b{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="840" height="486" rx="12" fill="#f6f8fa"/>
